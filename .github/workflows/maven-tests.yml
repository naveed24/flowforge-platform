name: Maven tests

on:
  pull_request:
  push:

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      FLOWFORGE_PG_TEST_URL: jdbc:postgresql://localhost:5432/flowforge_ci
      FLOWFORGE_PG_TEST_USER: flowforge
      FLOWFORGE_PG_TEST_PASSWORD: flowforge_test
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: flowforge_ci
          POSTGRES_USER: flowforge
          POSTGRES_PASSWORD: flowforge_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U flowforge -d flowforge_ci"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Run tests
        run: mvn --batch-mode --no-transfer-progress test
