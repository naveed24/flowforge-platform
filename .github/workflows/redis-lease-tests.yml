name: Redis worker lease integration

on:
  pull_request:
  push:

jobs:
  redis-leases:
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6380:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    permissions:
      contents: read
    env:
      FLOWFORGE_REDIS_TEST: "true"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Verify Redis lease ownership
        run: mvn --batch-mode --no-transfer-progress -Dtest=RedisWorkerLeaseIntegrationTest,RedisWorkerLeaseTtlIntegrationTest test
