spring:
  application:
    name: flowforge-platform

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5433/flowforge}
    username: ${DB_USERNAME:flowforge}
    password: ${DB_PASSWORD:flowforge}

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false

  flyway:
    enabled: true

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: com.flowforge.execution.DispatchOrRawValueSerializer
      acks: all
      properties:
        enable.idempotence: true
        max.in.flight.requests.per.connection: 5

    consumer:
      group-id: ${FLOWFORGE_WORKER_GROUP_ID:flowforge-workers}
      enable-auto-commit: false
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.ErrorHandlingDeserializer
      properties:
        spring.deserializer.value.delegate.class: org.springframework.kafka.support.serializer.JacksonJsonDeserializer
        spring.json.trusted.packages: com.flowforge.execution
        spring.json.value.default.type: com.flowforge.execution.ExecutionDispatchMessage
    listener:
      ack-mode: manual_immediate

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6380}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      probes:
        enabled: true

server:
  port: ${SERVER_PORT:8081}
  shutdown: graceful

flowforge:
  execution:
    recovery:
      enabled: ${FLOWFORGE_STALE_RECOVERY_ENABLED:false}
      timeout-ms: ${FLOWFORGE_STALE_RECOVERY_TIMEOUT_MS:900000}
      poll-interval-ms: ${FLOWFORGE_STALE_RECOVERY_POLL_INTERVAL_MS:60000}
      poll-initial-delay-ms: ${FLOWFORGE_STALE_RECOVERY_POLL_INITIAL_DELAY_MS:60000}
    retry:
      backlog:
        enabled: ${FLOWFORGE_RETRY_BACKLOG_METRICS_ENABLED:false}
        poll-interval-ms: ${FLOWFORGE_RETRY_BACKLOG_METRICS_INTERVAL_MS:30000}
        poll-initial-delay-ms: ${FLOWFORGE_RETRY_BACKLOG_METRICS_INITIAL_DELAY_MS:30000}
    dispatch:
      enabled: ${FLOWFORGE_DISPATCH_ENABLED:false}
      topic: ${FLOWFORGE_DISPATCH_TOPIC:flowforge.execution.dispatch.v1}
      batch-size: 25
      claim-lease-ms: 60000
      ack-timeout-ms: 10000
      poll-interval-ms: 2000
      poll-initial-delay-ms: 5000

  worker:
    consumer:
      enabled: ${FLOWFORGE_WORKER_ENABLED:false}
      group-id: ${FLOWFORGE_WORKER_GROUP_ID:flowforge-workers}
      dlt-topic: ${FLOWFORGE_WORKER_DLT_TOPIC:flowforge.execution.dispatch.v1.DLT}
      lease-enabled: ${FLOWFORGE_WORKER_LEASE_ENABLED:false}
