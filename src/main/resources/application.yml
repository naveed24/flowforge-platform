spring:
  application:
    name: flowforge-platform

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5433/flowforge}
    username: ${DB_USERNAME:flowforge}
    password: ${DB_PASSWORD:flowforge}

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false

  flyway:
    enabled: true

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      acks: all
      properties:
        enable.idempotence: true
        max.in.flight.requests.per.connection: 5

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6380}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      probes:
        enabled: true

server:
  port: ${SERVER_PORT:8081}
  shutdown: graceful

flowforge:
  execution:
    dispatch:
      enabled: ${FLOWFORGE_DISPATCH_ENABLED:false}
      topic: ${FLOWFORGE_DISPATCH_TOPIC:flowforge.execution.dispatch.v1}
      batch-size: 25
      claim-lease-ms: 60000
      ack-timeout-ms: 10000
      poll-interval-ms: 2000
      poll-initial-delay-ms: 5000
